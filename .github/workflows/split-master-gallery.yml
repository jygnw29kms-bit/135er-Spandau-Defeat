name: Split AI master gallery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python tools/split_master_gallery.py
      - name: Commit map master references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/source2/masters/maps
          git diff --cached --quiet || git commit -m "Add individual AI master references for all 20 maps"
          git push
