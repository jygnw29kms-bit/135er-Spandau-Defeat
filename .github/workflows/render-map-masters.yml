name: Render full-resolution map masters
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_map_masters.py"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify image-generation credential
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY secret is missing" && exit 2)
      - name: Install verifier\n        run: python -m pip install pillow\n      - name: Render 20 individual full-resolution masters\n        run: python tools/generate_map_masters.py
      - name: Commit verified master set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/source2/masters/maps README.md
          git diff --cached --quiet || git commit -m "Replace map masters with full-resolution individual renders"
          git pull --rebase origin main
          git push origin main
