name: Validate Rathaus runtime gameplay

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/gameplay/**'
      - 'tools/repo/validate_spandau_scope.py'
      - 'ue5/SpandauStrike/Content/Python/validate_rathaus_runtime_handoff.py'
      - 'ue5/SpandauStrike/Design/Gameplay/**'
      - 'tools/blender_pipeline/builds/rathaus_spandau/SpandauStrike_Rathaus_WORLD_MASTER_v42_RUNTIME_OBJECTIVES_EXPORT_MANIFEST.json'
      - '.github/workflows/validate-rathaus-runtime-gameplay.yml'
  pull_request:
    paths:
      - 'tools/gameplay/**'
      - 'tools/repo/validate_spandau_scope.py'
      - 'ue5/SpandauStrike/Content/Python/validate_rathaus_runtime_handoff.py'
      - 'ue5/SpandauStrike/Design/Gameplay/**'
      - 'tools/blender_pipeline/builds/rathaus_spandau/SpandauStrike_Rathaus_WORLD_MASTER_v42_RUNTIME_OBJECTIVES_EXPORT_MANIFEST.json'
      - '.github/workflows/validate-rathaus-runtime-gameplay.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: |
          python -m py_compile tools/gameplay/*.py
          python -m py_compile tools/gameplay/tests/*.py
          python -m py_compile tools/repo/validate_spandau_scope.py
          python -m py_compile ue5/SpandauStrike/Content/Python/validate_rathaus_runtime_handoff.py

      - name: Validate repository scope
        run: |
          python tools/repo/validate_spandau_scope.py

      - name: Run gameplay regression tests
        run: |
          python -m unittest discover -s tools/gameplay/tests -p 'test_*.py' -v

      - name: Validate gameplay bundle
        run: |
          python tools/gameplay/validate_gameplay_bundle.py

      - name: Validate core gameplay configuration
        run: |
          python tools/gameplay/validate_gameplay_config.py

      - name: Validate GAS ability contracts
        run: |
          python tools/gameplay/validate_ability_contracts.py

      - name: Validate GAS attribute contracts
        run: |
          python tools/gameplay/validate_attribute_contracts.py

      - name: Validate movement contract
        run: |
          python tools/gameplay/validate_movement_contract.py

      - name: Validate territorial objective state machine
        run: |
          python tools/gameplay/validate_objective_state_machine.py

      - name: Validate linear frontline flow
        run: |
          python tools/gameplay/validate_frontline_flow.py

      - name: Validate spawn policy
        run: |
          python tools/gameplay/validate_spawn_policy.py

      - name: Generate UE gameplay tag snippet
        run: |
          python tools/gameplay/generate_ue_gameplay_tag_snippet.py --out /tmp/SpandauStrikeGameplayTags.ini

      - name: Generate UE DataTable seeds
        run: |
          python tools/gameplay/build_ue_datatable_csv.py --out-dir /tmp/SpandauStrikeDataTables
          test -s /tmp/SpandauStrikeDataTables/DT_SpandauStrike_Classes.csv
          test -s /tmp/SpandauStrikeDataTables/DT_SpandauStrike_WeaponArchetypes.csv
          test -s /tmp/SpandauStrikeDataTables/DT_SpandauStrike_Movement.csv
          test -s /tmp/SpandauStrikeDataTables/DT_SpandauStrike_Objectives.csv
          test -s /tmp/SpandauStrikeDataTables/DT_SpandauStrike_CombatAnchors.csv

      - name: Validate and generate Rathaus handoff
        run: |
          python tools/gameplay/build_runtime_gameplay_handoff.py --out /tmp/runtime_gameplay_handoff_v42.json

      - name: Generate fingerprinted UE import plan
        run: |
          python tools/gameplay/build_ue_import_plan.py --out /tmp/runtime_import_plan_v1.json
          test -s /tmp/runtime_import_plan_v1.json

      - name: Generate coordinate invariants
        run: |
          python tools/gameplay/build_coordinate_invariants.py --out /tmp/rathaus_coordinate_invariants_v1.json
          test -s /tmp/rathaus_coordinate_invariants_v1.json

      - name: Generate Rathaus map flow report
        run: |
          python tools/gameplay/build_map_flow_report.py --out /tmp/rathaus_map_flow_report_v1.json
          test -s /tmp/rathaus_map_flow_report_v1.json

      - name: Generate Rathaus spawn safety report
        run: |
          python tools/gameplay/build_spawn_safety_report.py --out /tmp/rathaus_spawn_safety_report_v1.json
          test -s /tmp/rathaus_spawn_safety_report_v1.json

      - name: Generate derived balance report
        run: |
          python tools/gameplay/build_balance_report.py --out /tmp/gameplay_balance_report_v1.json
          test -s /tmp/gameplay_balance_report_v1.json

      - name: Verify project-owned naming
        shell: bash
        run: |
          ! grep -RniE 'day of defeat|dod:s|dods' tools/gameplay docs/UE5_RUNTIME_GAMEPLAY_HANDOFF.md ue5/SpandauStrike/Design/Gameplay

      - name: Publish validated gameplay handoff
        uses: actions/upload-artifact@v4
        with:
          name: spandau-strike-rathaus-runtime-handoff
          path: |
            /tmp/runtime_gameplay_handoff_v42.json
            /tmp/runtime_import_plan_v1.json
            /tmp/rathaus_coordinate_invariants_v1.json
            /tmp/rathaus_map_flow_report_v1.json
            /tmp/rathaus_spawn_safety_report_v1.json
            /tmp/gameplay_balance_report_v1.json
            /tmp/SpandauStrikeGameplayTags.ini
            /tmp/SpandauStrikeDataTables/*.csv
            ue5/SpandauStrike/Design/Gameplay/gameplay_bundle_v1.json
            ue5/SpandauStrike/Design/Gameplay/core_gameplay_tuning_v1.json
            ue5/SpandauStrike/Design/Gameplay/weapon_archetypes_v1.json
            ue5/SpandauStrike/Design/Gameplay/class_loadouts_v1.json
            ue5/SpandauStrike/Design/Gameplay/ability_contracts_v1.json
            ue5/SpandauStrike/Design/Gameplay/attribute_contracts_v1.json
            ue5/SpandauStrike/Design/Gameplay/movement_contract_v1.json
            ue5/SpandauStrike/Design/Gameplay/objective_state_machine_v1.json
            ue5/SpandauStrike/Design/Gameplay/spawn_policy_v1.json
            ue5/SpandauStrike/Design/Gameplay/rathaus_lane_flow_v1.json
            ue5/SpandauStrike/Design/Gameplay/rathaus_combat_flow_v1.json
          if-no-files-found: error
          retention-days: 30
