name: Validate Rathaus runtime gameplay

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/gameplay/**'
      - 'tools/repo/validate_spandau_scope.py'
      - 'ue5/SpandauStrike/Design/Gameplay/**'
      - 'tools/blender_pipeline/builds/rathaus_spandau/SpandauStrike_Rathaus_WORLD_MASTER_v42_RUNTIME_OBJECTIVES_EXPORT_MANIFEST.json'
      - '.github/workflows/validate-rathaus-runtime-gameplay.yml'
  pull_request:
    paths:
      - 'tools/gameplay/**'
      - 'tools/repo/validate_spandau_scope.py'
      - 'ue5/SpandauStrike/Design/Gameplay/**'
      - 'tools/blender_pipeline/builds/rathaus_spandau/SpandauStrike_Rathaus_WORLD_MASTER_v42_RUNTIME_OBJECTIVES_EXPORT_MANIFEST.json'
      - '.github/workflows/validate-rathaus-runtime-gameplay.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository scope
        run: |
          python tools/repo/validate_spandau_scope.py

      - name: Validate core gameplay configuration
        run: |
          python tools/gameplay/validate_gameplay_config.py

      - name: Generate UE gameplay tag snippet
        run: |
          python tools/gameplay/generate_ue_gameplay_tag_snippet.py --out /tmp/SpandauStrikeGameplayTags.ini

      - name: Validate and generate Rathaus handoff
        run: |
          python tools/gameplay/build_runtime_gameplay_handoff.py --out /tmp/runtime_gameplay_handoff_v42.json

      - name: Verify project-owned naming
        shell: bash
        run: |
          ! grep -RniE 'day of defeat|dod:s|dods' tools/gameplay docs/UE5_RUNTIME_GAMEPLAY_HANDOFF.md ue5/SpandauStrike/Design/Gameplay

      - name: Publish validated gameplay handoff
        uses: actions/upload-artifact@v4
        with:
          name: spandau-strike-rathaus-runtime-handoff
          path: |
            /tmp/runtime_gameplay_handoff_v42.json
            /tmp/SpandauStrikeGameplayTags.ini
          if-no-files-found: error
          retention-days: 30
