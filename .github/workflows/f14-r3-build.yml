name: Build F-14 R3 P2S release

on:
  workflow_dispatch:
  push:
    paths:
      - "side-projects/F14_RC_FDM/r3/generate_r3.py"
      - "side-projects/F14_RC_FDM/r3/make_p2s_r3.py"
      - "side-projects/F14_RC_FDM/r3/README.md"
      - "side-projects/F14_RC_FDM/r3/BUILD_PLAN.md"
      - "side-projects/F14_RC_FDM/r3/PRINT_PLATES.md"
      - ".github/workflows/f14-r3-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenSCAD and geometry tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install --upgrade pip
          pip install numpy trimesh shapely networkx

      - name: Generate scale SCAD and STL set
        working-directory: side-projects/F14_RC_FDM/r3
        run: python generate_r3.py

      - name: Validate STL geometry
        working-directory: side-projects/F14_RC_FDM/r3
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path("docs/mesh_validation.json").read_text())
          n=d["individual_count"]
          ok=(d["watertight_individual"]==n and d["winding_individual"]==n and d["fits256_individual"]==n and not d["failures"])
          print(json.dumps(d,indent=2))
          if not ok:
              sys.exit("R3 STL validation failed")
          PY

      - name: Generate 3MF files and optimized P2S plates
        working-directory: side-projects/F14_RC_FDM/r3
        run: python make_p2s_r3.py

      - name: Validate final P2S plate bounds
        working-directory: side-projects/F14_RC_FDM/r3
        run: |
          python - <<'PY'
          import pathlib, trimesh, sys
          bad=[]
          for f in sorted(pathlib.Path("p2s/plates_3mf").glob("*.3mf")):
              s=trimesh.load(f,force="scene")
              b=s.bounds; e=b[1]-b[0]
              if e[0] > 256.01 or e[1] > 256.01 or b[0][0] < -0.01 or b[0][1] < -0.01:
                  bad.append((f.name,e.tolist(),b.tolist()))
          print("plates:",len(list(pathlib.Path("p2s/plates_3mf").glob("*.3mf"))))
          print("bad:",bad)
          if bad:
              sys.exit("P2S plate bound validation failed")
          PY

      - name: Commit generated STL / 3MF release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add side-projects/F14_RC_FDM/r3/stl                   side-projects/F14_RC_FDM/r3/scad/generated_parts                   side-projects/F14_RC_FDM/r3/docs/mesh_validation.csv                   side-projects/F14_RC_FDM/r3/docs/mesh_validation.json                   side-projects/F14_RC_FDM/r3/p2s
          if git diff --cached --quiet; then
            echo "No generated geometry changes"
          else
            git commit -m "Generate F-14 R3 P2S STL/3MF release [skip ci]"
            git push
          fi
